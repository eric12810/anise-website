name: Guarded staging upload

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type UPLOAD STAGING to authorize this upload'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: anise-staging-upload
  cancel-in-progress: false

jobs:
  upload:
    if: github.ref == 'refs/heads/staging' && inputs.confirm == 'UPLOAD STAGING'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build complete release artifact offline
        run: |
          python3 -m unittest discover -s tests/deployment -v
          PYTHONPATH=scripts RELEASE_VERSION="${GITHUB_SHA}" python3 scripts/release-artifact.py
      - name: Upload only changed, approved staging files via FTPS
        env:
          FTPS_HOST: ${{ secrets.STAGING_FTPS_HOST }}
          FTPS_USERNAME: ${{ secrets.STAGING_FTPS_USERNAME }}
          FTPS_PASSWORD: ${{ secrets.STAGING_FTPS_PASSWORD }}
        run: |
          python3 scripts/website-staging-deploy.py --upload
      - name: Verify staging and record deployed release
        run: |
          curl --fail --silent --show-error --max-time 20 https://www.staging.loveanise.co.uk/ > /dev/null
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('artifacts/website-release/staging-deployment-record.json').write_text(json.dumps({'status':'verified','run_id':os.environ['GITHUB_RUN_ID'],'commit_sha':os.environ['GITHUB_SHA'],'artifact_name':'anise-website-staging-release-'+os.environ['GITHUB_SHA']}, sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: anise-website-staging-release-${{ github.sha }}
          path: artifacts/website-release
          if-no-files-found: error
          retention-days: 90
