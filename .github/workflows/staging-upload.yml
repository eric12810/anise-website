name: Guarded staging upload

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type UPLOAD STAGING to authorize this upload'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: anise-staging-upload
  cancel-in-progress: false

jobs:
  upload:
    if: github.ref == 'refs/heads/staging' && inputs.confirm == 'UPLOAD STAGING'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Upload only changed, approved staging files via FTPS
        env:
          FTPS_HOST: ${{ secrets.STAGING_FTPS_HOST }}
          FTPS_USERNAME: ${{ secrets.STAGING_FTPS_USERNAME }}
          FTPS_PASSWORD: ${{ secrets.STAGING_FTPS_PASSWORD }}
        run: |
          python3 scripts/website-staging-deploy.py --upload
