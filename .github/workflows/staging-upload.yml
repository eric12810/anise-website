name: Guarded staging upload

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type UPLOAD STAGING to authorize this upload'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: anise-staging-upload
  cancel-in-progress: false

jobs:
  upload:
    if: github.ref == 'refs/heads/staging' && inputs.confirm == 'UPLOAD STAGING'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Upload approved staging files
        env:
          FTPS_HOST: ${{ secrets.STAGING_FTPS_HOST }}
          FTPS_USERNAME: ${{ secrets.STAGING_FTPS_USERNAME }}
          FTPS_PASSWORD: ${{ secrets.STAGING_FTPS_PASSWORD }}
        run: |
          python3 - <<'PY'
          import ftplib, hashlib, os, pathlib, re, ssl, subprocess, sys

          root = pathlib.Path.cwd()
          names = """index.html menu.html order.html order-status.html philosophy.html
          creations.html vegan.html stripe-cancelled.html styles.css menu-live.js
          order.css order.js order-status.js ordering-status.js plum-background.js
          promotion-cookie.js promotions-display.js stripe-resume.js
          dish-thumbnail.ashx""".split()
          tracked = set(subprocess.check_output(["git", "ls-files", "-z"], text=True).split("\0"))
          extensions = {".svg", ".png", ".webp", ".jpg", ".jpeg", ".mp4",
                        ".eot", ".ttf", ".woff", ".woff2"}
          names += [n for n in tracked if n.startswith("public/") and
                    pathlib.PurePosixPath(n).suffix.lower() in extensions]
          names = sorted(set(names))
          for n in names:
              p = pathlib.Path(n)
              if (not re.fullmatch(r"[A-Za-z0-9_./-]+", n) or ".." in p.parts
                  or n not in tracked or not p.is_file() or
                  any((root / pathlib.Path(*p.parts[:i])).is_symlink()
                      for i in range(1, len(p.parts) + 1))):
                  sys.exit("Unsafe or missing candidate path: " + n)
              print(hashlib.sha256(p.read_bytes()).hexdigest(), n)
          host = os.getenv("FTPS_HOST", "")
          user = os.getenv("FTPS_USERNAME", "")
          password = os.getenv("FTPS_PASSWORD", "")
          if host.lower() != "wsuk32.pronameserver.com" or user != "stagesiteftp" or not password:
              sys.exit("Missing or unexpected staging FTPS settings.")
          phase = "connecting"
          try:
              ftp = ftplib.FTP_TLS(context=ssl.create_default_context(), timeout=30)
              ftp.connect(host, 21)
              phase = "logging in"
              ftp.login(user, password)
              phase = "securing data connection"
              ftp.prot_p()
              target = "/stagesiteftp/wwwroot"
              phase = "accessing staging directory"
              ftp.cwd(target)
              if ftp.pwd().rstrip("/") != target:
                  sys.exit("Unexpected staging directory.")
              for n in names:
                  parts = pathlib.PurePosixPath(n).parts
                  ftp.cwd(target)
                  for component in parts[:-1]:
                      try:
                          ftp.cwd(component)
                      except ftplib.error_perm:
                          ftp.mkd(component)
                          ftp.cwd(component)
                  phase = "uploading " + n
                  print("Starting", n, flush=True)
                  with open(n, "rb") as source:
                      ftp.storbinary("STOR " + parts[-1], source)
                  print("Uploaded", n, flush=True)
              ftp.quit()
          except (OSError, ftplib.Error) as exc:
              print("Upload failed during", phase, ":", type(exc).__name__, flush=True)
              sys.exit(1)
          print("Upload complete. Existing web.config and unlisted files were preserved.")
          PY
